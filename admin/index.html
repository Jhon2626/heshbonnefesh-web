<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Heshbon Nefesh — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080C14; --surface: #0F1520; --surface2: #141B27; --surface3: #1A2235;
      --border: #1E2A3E; --border2: #243045;
      --gold: #C9A84C; --gold2: #E8C46A; --gold-dim: rgba(201,168,76,0.12);
      --blue: #3B82F6; --green: #10B981; --red: #EF4444; --purple: #8B5CF6;
      --text: #E2E8F0; --text2: #94A3B8; --text3: #4A5568;
      --radius: 10px; --radius-lg: 14px; --radius-xl: 18px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* ── Inputs ── */
    .inp { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 9px 13px; width: 100%; font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; transition: border-color .15s, box-shadow .15s; }
    .inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.1); }
    .inp::placeholder { color: var(--text3); }
    textarea.inp { resize: vertical; line-height: 1.6; }
    select.inp { cursor: pointer; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--radius); padding: 8px 16px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; transition: all .15s; white-space: nowrap; }
    .btn-gold { background: var(--gold); color: #0A0C10; }
    .btn-gold:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }
    .btn-ghost { background: transparent; color: var(--text2); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
    .btn-blue { background: rgba(59,130,246,0.12); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); }
    .btn-blue:hover { background: rgba(59,130,246,0.2); }
    .btn-red { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
    .btn-red:hover { background: rgba(239,68,68,0.18); }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
    .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
    .btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 8px; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .card2 { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); }
    .card3 { background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius); }

    /* ── Badges / pastilles (composant générique, partagé) ── */
    .badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 99px; padding: 2px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .b-gold { background: rgba(201,168,76,0.12); color: var(--gold); border: 1px solid rgba(201,168,76,0.25); }
    .b-blue { background: rgba(59,130,246,0.12); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); }
    .b-green { background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
    .b-red { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
    .b-gray { background: rgba(148,163,184,0.08); color: var(--text2); border: 1px solid rgba(148,163,184,0.15); }
    .b-purple { background: rgba(139,92,246,0.12); color: var(--purple); border: 1px solid rgba(139,92,246,0.25); }

    /* ── Sidebar ── */
    #sidebar { width: 220px; min-height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); transition: all .15s; margin: 1px 8px; }
    .nav-item:hover { background: var(--gold-dim); color: var(--text); }
    .nav-item.active { background: var(--gold-dim); color: var(--gold); font-weight: 600; }
    .nav-item.active svg { color: var(--gold); }
    .nav-section { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); padding: 16px 22px 6px; }

    /* ── Toggle ── */
    .toggle { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .tslider { position: absolute; inset: 0; background: var(--border2); border-radius: 99px; cursor: pointer; transition: .2s; }
    .tslider:before { content: ''; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: var(--text3); border-radius: 50%; transition: .2s; }
    .toggle input:checked + .tslider { background: rgba(201,168,76,0.35); }
    .toggle input:checked + .tslider:before { transform: translateX(18px); background: var(--gold); }

    /* ── Tabs ── */
    .tab-bar { display: flex; gap: 2px; padding: 4px; background: var(--bg); border-radius: 10px; border: 1px solid var(--border); }
    .tab { padding: 6px 13px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text2); transition: all .15s; white-space: nowrap; }
    .tab.active { background: var(--surface3); color: var(--gold); font-weight: 600; }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-xl); width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
    /* Mode « passe-plat » : le contenu (carte autoportée des modals détail user / RGPD) devient enfant direct de #overlay, sans double cadre. Garde le nœud #modal vivant. */
    .modal-plain { display: contents; }

    /* ── Table ── */
    .trow { border-bottom: 1px solid var(--surface2); transition: background .1s; }
    .trow:hover { background: rgba(201,168,76,0.025); }
    .th { text-align: left; padding: 10px 16px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); }
    .td { padding: 12px 16px; font-size: 13px; vertical-align: middle; }

    /* ── Loader & Toast ── */
    .loader { border: 2px solid var(--border2); border-top: 2px solid var(--gold); border-radius: 50%; width: 18px; height: 18px; animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 10px; font-size: 13px; z-index: 300; transform: translateY(80px); opacity: 0; transition: all .25s; display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok { border-color: rgba(16,185,129,0.4); color: var(--green); }
    #toast.err { border-color: rgba(239,68,68,0.4); color: var(--red); }

    /* ── Cat cards ── */
    .cat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-xl); padding: 20px; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
    .cat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); border-color: rgba(201,168,76,0.3); }
    .cat-card .arr { opacity: 0; transform: translateX(-4px); transition: all .2s; }
    .cat-card:hover .arr { opacity: 1; transform: translateX(0); }
    .cat-add { border: 1.5px dashed var(--border2); background: transparent; }
    .cat-add:hover { border-color: var(--gold); background: var(--gold-dim); }

    /* ── Breadcrumb ── */
    .bc { font-size: 13px; }
    .bc-link { color: var(--text2); cursor: pointer; transition: color .15s; }
    .bc-link:hover { color: var(--gold); }
    .bc-cur { color: var(--text); font-weight: 600; }
    .bc-sep { color: var(--border2); margin: 0 6px; font-size: 16px; }

    /* ── Action item ── */
    .action-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; transition: all .15s; }
    .action-item:hover { border-color: rgba(201,168,76,0.2); }
    /* ── Templates accordion ── */
    .tpl-group { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 8px; }
    .tpl-group > summary { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 12px; font-weight: 700; color: var(--text2); }
    .tpl-group > summary::-webkit-details-marker { display: none; }
    .tpl-group > summary:hover { color: var(--text); }
    .tpl-group .tpl-caret { transition: transform .15s; opacity: .6; }
    .tpl-group[open] > summary .tpl-caret { transform: rotate(90deg); }
    .tpl-group__body { padding: 0 14px 14px; }

    /* ── Field label ── */
    .fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }

    /* ── Stat card ── */
    .stat { background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; }
    .stat::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; opacity: 0.06; }

    /* ── Glow dot ── */
    .gdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Section in modal ── */
    .msec { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

    /* ── Info box ── */
    .info-box { background: rgba(201,168,76,0.06); border: 1px solid rgba(201,168,76,0.18); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--gold); display: flex; align-items: flex-start; gap: 8px; }

    /* ══════════════════════════════════════════
       RESPONSIVE — mobile ≤768px / tablette
       ══════════════════════════════════════════ */

    /* ── Hamburger button ── */
    #hamburger {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 400;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    #hamburger:hover { background: var(--gold-dim); color: var(--gold); }

    /* ── Backdrop semi-transparent derrière le drawer ── */
    #sidebarBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 299;
    }
    #sidebarBackdrop.open { display: block; }

    @media (max-width: 768px) {
      /* Hamburger visible */
      #hamburger { display: flex; }

      /* Sidebar : drawer off-canvas */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 300;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      #sidebar.open { transform: translateX(0); }

      /* Tables : scroll horizontal */
      #main table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      /* Grilles inline fixes → 1 colonne */
      #main [style*="grid-template-columns:repeat(4,1fr)"],
      #main [style*="grid-template-columns:repeat(3,1fr)"] {
        grid-template-columns: 1fr !important;
      }

      /* Grille 2 col dashboard → 1 colonne */
      #main [style*="grid-template-columns:1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }

      /* Modals pleine largeur */
      .overlay { padding: 8px; }
      .modal { max-width: 100% !important; max-height: 94vh; }

      /* Padding réduit dans les pages */
      #main > div[style*="padding:32px"] {
        padding: 16px !important;
      }
    }

    @media (min-width: 769px) {
      /* Desktop : hamburger caché */
      #hamburger { display: none !important; }
      #sidebarBackdrop { display: none !important; }
      /* Sidebar statique */
      #sidebar {
        position: static;
        transform: none !important;
        height: auto;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>

<div id="toast"></div>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:380px;">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px;">
      <div style="width:64px;height:64px;border-radius:20px;background:var(--gold-dim);border:1.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;">✡️</div>
      <h1 style="font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.3px;">Heshbon Nefesh</h1>
      <p style="font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;">Panel Administrateur</p>
    </div>
    <!-- Card -->
    <div class="card" style="padding:28px;">
      <div id="loginErr" style="display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;"></div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <label class="fl">Email</label>
          <input id="lEmail" type="email" class="inp" placeholder="admin@heshbon.com"/>
        </div>
        <div>
          <label class="fl">Mot de passe</label>
          <input id="lPwd" type="password" class="inp" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
        </div>
        <button onclick="login()" class="btn btn-gold" id="lBtn" style="justify-content:center;padding:11px;margin-top:4px;font-size:14px;">
          Se connecter
        </button>
      </div>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--text3);margin-top:16px;">Accès restreint aux administrateurs</p>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="appScreen" style="display:none;min-height:100vh;">

  <!-- HAMBURGER (mobile uniquement — caché sur desktop via CSS) -->
  <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>

  <!-- BACKDROP (ferme le drawer au tap extérieur) -->
  <div id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <!-- Logo -->
    <div style="padding:20px 16px 16px;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">✡️</div>
        <div>
          <p style="font-size:13px;font-weight:700;color:var(--text);">Heshbon Nefesh</p>
          <p style="font-size:10px;color:var(--text3);letter-spacing:0.5px;">Admin Panel</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav style="flex:1;padding:8px 0;overflow-y:auto;">
      <div class="nav-section">Vue d'ensemble</div>
      <div onclick="go('dash')" class="nav-item" id="n-dash">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>

      <div class="nav-section">Catalogue</div>
      <div onclick="go('cat')" class="nav-item" id="n-cat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Catalogue
      </div>

      <div class="nav-section">Engagement</div>
      <div onclick="go('defis')" class="nav-item" id="n-defis">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Défis & Scénarios
      </div>

      <div class="nav-section">Utilisateurs</div>
      <div onclick="go('users')" class="nav-item" id="n-users">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Utilisateurs
      </div>

      <div class="nav-section">IA</div>
      <div onclick="go('bilan-ia')" class="nav-item" id="n-bilan-ia">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Bilan IA
      </div>
      <div onclick="go('notifs')" class="nav-item" id="n-notifs">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notifications
      </div>
    </nav>

    <!-- User -->
    <div style="padding:12px;border-top:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface2);">
        <div id="aAvatar" style="width:30px;height:30px;border-radius:8px;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;">A</div>
        <span id="aEmail" style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">admin</span>
        <button onclick="logout()" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px;transition:color .15s;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text3)'">⏻</button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main" style="flex:1;overflow:auto;"></main>
</div>

<!-- MODAL -->
<div id="overlay" class="overlay" style="display:none;" onclick="overlayClick(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
// ══════════════════════════════
// CONFIG SUPABASE
// ══════════════════════════════
const SB_URL = 'https://tqrjwvgrdomfvgtgqgrd.supabase.co';
const SB_KEY = 'sb_publishable_S6uP6lGlI5a0aATxtXlYEA_jbTVcC18';
const sb = supabase.createClient(SB_URL, SB_KEY);
let me = null;

// Catalogue navigation state
let CN = { level:'cats', cat:null, sc:null, action:null };

// ── Recherche globale actions — cache (ne pas toucher aux autres caches) ──
let _actSearchTerm = '';
let _actSearchResults = null; // null = pas de recherche active, [] = recherche sans résultat

// ══════════════════════════════
// AUTH
// ══════════════════════════════
async function login() {
  const email = gi('lEmail').value.trim();
  const pwd = gi('lPwd').value;
  const btn = gi('lBtn');
  if (!email || !pwd) { lerr('Remplis tous les champs.'); return; }
  btn.innerHTML = '<span class="loader"></span>'; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) { lerr(error.message); btn.innerHTML = 'Se connecter'; btn.disabled = false; return; }
  me = data.user;
  const { data: p } = await sb.from('profiles').select('is_admin').eq('id', me.id).single();
  if (!p?.is_admin) { await sb.auth.signOut(); lerr('Accès refusé — compte non autorisé.'); btn.innerHTML = 'Se connecter'; btn.disabled = false; return; }
  showApp();
}
function lerr(msg) { const e = gi('loginErr'); e.textContent = msg; e.style.display = 'block'; }

// ── Garde d'écriture : une RLS peut FILTRER un update/delete sans erreur
// (200, 0 ligne). On demande les lignes affectées et on refuse le succès
// silencieux — sinon le panneau affiche « OK » alors que rien n'a changé.
const RLS_HINT = '0 ligne affectée — droits admin insuffisants (RLS) ou ligne introuvable. Vérifie profiles.is_admin et les policies d\'écriture (SQL Editor).';
async function guardedUpdate(builder) {
  const { data, error } = await builder.select('id');
  if (error) return { error };
  if (!data || data.length === 0) return { error: { message: RLS_HINT } };
  return { error: null };
}

async function del(table, id, refresh) {
  // ── Suppression intelligente pour predefined_actions & defis ──
  // Ces deux tables sont référencées par des données utilisateur :
  //  • user_actions.predefined_action_id (ON DELETE SET NULL) + CHECK
  //    « is_custom=false ⇒ predefined_action_id NOT NULL » : supprimer une
  //    action ADOPTÉE fait échouer tout le DELETE (violation de contrainte).
  //  • user_defis.defi_id (ON DELETE CASCADE) : supprimer un défi ACCEPTÉ
  //    efface silencieusement l'historique des utilisateurs.
  // → si des utilisateurs l'utilisent, on propose de DÉSACTIVER (actif/is_active
  //   = false) : invisible pour les nouveaux (le catalogue filtre actif=true),
  //   mais conservé pour ceux qui l'ont déjà (le dashboard ne filtre pas).
  if (table === 'predefined_actions' || table === 'defis') {
    const isAction = table === 'predefined_actions';
    const usageTable = isAction ? 'user_actions' : 'user_defis';
    const usageCol   = isAction ? 'predefined_action_id' : 'defi_id';
    const activeCol  = isAction ? 'actif' : 'is_active';
    const label      = isAction ? 'pratique' : 'défi';

    const { count, error: cErr } = await sb.from(usageTable)
      .select('*', { count: 'exact', head: true }).eq(usageCol, id);
    if (cErr) { toast('Vérif. usage impossible : ' + cErr.message, 'err'); return; }

    if (count && count > 0) {
      const ok = confirm(
        `⚠️ ${count} utilisateur(s) utilisent ce/cette ${label}.\n\n`
        + `La supprimer effacerait leurs données (progrès, séries, historique).\n\n`
        + `→ OK : la DÉSACTIVER (recommandé — invisible pour les nouveaux, données conservées)\n`
        + `→ Annuler : ne rien faire`
      );
      if (!ok) return;
      const { data, error } = await sb.from(table)
        .update({ [activeCol]: false }).eq('id', id).select('id');
      if (error) { toast(error.message, 'err'); return; }
      if (!data || data.length === 0) { toast(RLS_HINT, 'err'); return; }
      toast(`${isAction ? 'Pratique désactivée' : 'Défi désactivé'} (données utilisateurs conservées)`);
      if (refresh && window[refresh]) window[refresh]();
      return;
    }
    // Personne ne l'utilise → suppression réelle possible sans risque
  }

  if (!confirm('Supprimer définitivement ? Cette action est irréversible.')) return;
  const { data, error } = await sb.from(table).delete().eq('id', id).select('id');
  if (error) { toast(error.message, 'err'); return; }
  if (!data || data.length === 0) { toast(RLS_HINT, 'err'); return; }
  toast('Supprimé avec succès !');
  if (refresh && window[refresh]) window[refresh]();
}

// ── « 📊 Activité » : chargement des stats d'usage (lecture seule) ──
// Toutes les agrégations sont faites CÔTÉ CLIENT en JS (PostgREST ne fait pas
// de GROUP BY/DISTINCT arbitraire). Volumétrie faible (pré-lancement). Chaque
// stat est isolée dans son propre try/catch : une requête en échec retombe sur
// des valeurs neutres (0) sans casser le reste du dashboard.
async function loadActiviteStats() {
  const now = Date.now();
  const iso7   = new Date(now - 7 * 864e5).toISOString();          // pour sent_at / generated_at (timestamptz)
  const iso30  = new Date(now - 30 * 864e5).toISOString();
  const date7  = new Date(now - 7 * 864e5).toISOString().split('T')[0];  // pour daily_progress.date (type date)
  const date30 = new Date(now - 30 * 864e5).toISOString().split('T')[0];

  const out = {
    empty: true,                                  // passe à false dès qu'une table renvoie ≥1 ligne
    active7: 0, active30: 0,
    topActions: [],                               // [{ title, count }]
    bilan7: { n: 0, cost: 0 }, bilan30: { n: 0, cost: 0 },
    premium: { total: 0, premium: 0, free: 0, expiringSoon: 0 },
    notifs7: {}, notifs30: {},                    // { status: count }
  };

  // 1) Users actifs 7j / 30j — daily_progress (complétions) → user_id distinct
  // 2) Top 10 actions pratiquées — daily_progress.user_action_id sur 30j
  // (une seule requête 30j couvre actifs + top ; on déduit le 7j par filtrage)
  let topUserActionIds = [];
  try {
    const [dp30, dp7] = await Promise.all([
      sb.from('daily_progress').select('user_id,user_action_id').eq('completed', true).gte('date', date30),
      sb.from('daily_progress').select('user_id').eq('completed', true).gte('date', date7),
    ]);
    const rows30 = dp30.data || [];
    const rows7  = dp7.data  || [];
    if (rows30.length || rows7.length) out.empty = false;

    out.active30 = new Set(rows30.map(r => r.user_id)).size;
    out.active7  = new Set(rows7.map(r => r.user_id)).size;

    const cnt = {};
    rows30.forEach(r => { if (r.user_action_id != null) cnt[r.user_action_id] = (cnt[r.user_action_id] || 0) + 1; });
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 10);
    topUserActionIds = top.map(([id]) => id);
    out._topRaw = top;   // [[user_action_id, count], ...] — libellés résolus plus bas
  } catch (e) { console.warn('[activite] daily_progress', e); }

  // Résolution des libellés du top : user_actions → predefined_actions.title_fr
  try {
    if (topUserActionIds.length) {
      const { data: uaRows } = await sb.from('user_actions').select('id,predefined_action_id').in('id', topUserActionIds);
      const ua = uaRows || [];
      if (ua.length) out.empty = false;
      const uaMap = {}; ua.forEach(r => { uaMap[r.id] = r.predefined_action_id; });
      const predIds = [...new Set(ua.map(r => r.predefined_action_id).filter(x => x != null))];
      let titleMap = {};
      if (predIds.length) {
        const { data: pRows } = await sb.from('predefined_actions').select('id,title_fr').in('id', predIds);
        (pRows || []).forEach(p => { titleMap[p.id] = p.title_fr; });
      }
      out.topActions = (out._topRaw || []).map(([uaId, count]) => {
        const predId = uaMap[uaId];
        const title = predId != null ? titleMap[predId] : null;
        return { title: title || '—', count };   // orphan user_action / predefined → '—'
      });
    }
  } catch (e) { console.warn('[activite] top labels', e); }
  delete out._topRaw;

  // 3) Bilans IA 7j/30j + coût réel — bilan_ia_audit (⚠️ generated_at, JAMAIS created_at)
  try {
    const [b7, b30] = await Promise.all([
      sb.from('bilan_ia_audit').select('cost_estimate_usd,status').gte('generated_at', iso7),
      sb.from('bilan_ia_audit').select('cost_estimate_usd,status').gte('generated_at', iso30),
    ]);
    const agg = rows => {
      const r = rows || [];
      const cost = r.reduce((a, x) => a + (Number(x.cost_estimate_usd) || 0), 0);  // null ignoré
      return { n: r.length, cost };
    };
    const r7 = b7.data || [], r30 = b30.data || [];
    if (r7.length || r30.length) out.empty = false;
    out.bilan7  = agg(r7);
    out.bilan30 = agg(r30);
  } catch (e) { console.warn('[activite] bilan_ia_audit', e); }

  // 4) Premium vs Free — counts exacts sur profiles (déjà lisible par l'admin)
  try {
    const soonISO = new Date(now + 7 * 864e5).toISOString();
    const [tot, prem, soon] = await Promise.all([
      sb.from('profiles').select('id', { count: 'exact', head: true }),
      sb.from('profiles').select('id', { count: 'exact', head: true }).eq('is_premium', true),
      sb.from('profiles').select('id', { count: 'exact', head: true }).eq('is_premium', true).gte('current_period_end', new Date(now).toISOString()).lte('current_period_end', soonISO),
    ]);
    const total = tot.count || 0, premium = prem.count || 0;
    if (total > 0) out.empty = false;
    out.premium = { total, premium, free: Math.max(0, total - premium), expiringSoon: soon.count || 0 };
  } catch (e) { console.warn('[activite] profiles premium', e); }

  // 5) Notifs envoyées 7j/30j par statut — notification_log
  try {
    const [n7, n30] = await Promise.all([
      sb.from('notification_log').select('status').gte('sent_at', iso7),
      sb.from('notification_log').select('status').gte('sent_at', iso30),
    ]);
    const byStatus = rows => {
      const m = {}; (rows || []).forEach(r => { const s = r.status || 'unknown'; m[s] = (m[s] || 0) + 1; });
      return m;
    };
    const r7 = n7.data || [], r30 = n30.data || [];
    if (r7.length || r30.length) out.empty = false;
    out.notifs7  = byStatus(r7);
    out.notifs30 = byStatus(r30);
  } catch (e) { console.warn('[activite] notification_log', e); }

  return out;
}

/**
 * sanitizeQ — retire les caractères qui casseraient la syntaxe .or() de PostgREST
 * ou permettraient une injection de filtre :
 *   ,  → cassent la liste d'arguments .or()
 *   () → cassent le parsing de l'expression PostgREST
 *   .  → confondu avec le séparateur de colonne PostgREST
 *   % _ * → wildcards SQL involontaires dans ILIKE
 *   \  → caractère d'échappement LIKE
 * Conserve : lettres (accents, hébreu, latin), chiffres, espaces, apostrophes.
 */
function sanitizeQ(q) {
  return (q || '').replace(/[,().%_*\\]/g, '').trim();
}

let _actSearchDebounce = null;

function actSearchInput() {
  clearTimeout(_actSearchDebounce);
  _actSearchDebounce = setTimeout(async () => {
    const raw = (document.getElementById('actSearch')?.value || '').trim();
    const q = sanitizeQ(raw);
    if (q.length < 2) {
      _actSearchTerm = '';
      _actSearchResults = null;
      renderL1();
      return;
    }
    _actSearchTerm = q;
    await searchActs(q);
  }, 250);
}

async function searchActs(q) {
  const el = document.getElementById('act-search-results');
  if (el) {
    el.style.display = '';
    const catGrid = document.getElementById('cat-grid');
    if (catGrid) catGrid.style.display = 'none';
    el.innerHTML = '<div style="padding:20px;display:flex;align-items:center;gap:10px;"><span class="loader"></span><span style="color:var(--text2);font-size:13px;">Recherche…</span></div>';
  }
  try {
    const { data, error } = await sb
      .from('predefined_actions')
      .select('id,title_fr,title_he,title_en,code,sous_category_id,actif')
      .or(`title_fr.ilike.%${q}%,title_he.ilike.%${q}%,title_en.ilike.%${q}%,code.ilike.%${q}%`)
      .limit(50);
    if (error) { toast(error.message, 'err'); _actSearchResults = []; }
    else _actSearchResults = data || [];
  } catch (e) {
    toast('Erreur de recherche', 'err');
    _actSearchResults = [];
  }
  renderSearchResults();
}

function renderSearchResults() {
  const el = document.getElementById('act-search-results');
  if (!el) return;
  // Afficher la zone résultats, masquer la grille de navigation
  el.style.display = '';
  const catGrid = document.getElementById('cat-grid');
  if (catGrid) catGrid.style.display = 'none';
  const results = _actSearchResults || [];
  const q = _actSearchTerm;
  if (!results.length) {
    el.innerHTML = `<div style="padding:40px;text-align:center;"><div style="font-size:32px;margin-bottom:10px;">🔍</div><p style="color:var(--text2);font-size:14px;">Aucun résultat pour <strong>${h(q)}</strong></p></div>`;
    return;
  }
  el.innerHTML = `
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px;font-weight:500;">${results.length} résultat${results.length > 1 ? 's' : ''} pour « ${h(q)} »</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${results.map(a => `
      <div class="card" style="padding:14px 16px;display:flex;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;">
            <span style="font-size:14px;font-weight:700;color:var(--text);">${h(a.title_fr)}</span>
            ${a.title_he ? `<span style="font-size:12px;color:var(--text2);direction:rtl;">${h(a.title_he)}</span>` : ''}
            ${a.title_en ? `<span style="font-size:12px;color:var(--text3);">${h(a.title_en)}</span>` : ''}
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
            <span style="font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;background:var(--surface3);padding:2px 6px;border-radius:4px;">${h(a.code)}</span>
            ${a.actif ? '<span class="badge b-green">Actif</span>' : '<span class="badge b-red">Inactif</span>'}
          </div>
        </div>
        <button onclick="openActModal('${esc(a.id)}')" class="btn btn-blue btn-sm" style="flex-shrink:0;">✏️ Modifier</button>
      </div>`).join('')}
    </div>`;
}

          <button onclick="del('predefined_sous_actions','${e.id}','renderL4')" class="btn btn-red btn-sm">✕</button>
        </div>
      </div>`).join('')}
      ${!(etapes?.length) ? `<div class="card" style="padding:48px;text-align:center;"><div style="font-size:36px;margin-bottom:12px;">📋</div><p style="color:var(--text2);margin-bottom:16px;">Aucune étape pour cette action</p><button onclick="openEtapeModal()" class="btn btn-gold">+ Ajouter une étape</button></div>` : ''}
    </div>
  </div>`);
}

// ─── State pour les filtres ───
let usersData = [];
let categoriesData = [];
let userFilter = 'all';        // 'all' | 'onboarded' | 'pending' | 'premium' | 'free'
let userSearch = '';
let userSortKey = 'actions_completed';   // tri par défaut = classement par engagement
let userSortDir = 'desc';

async function renderUsers() {
  load();

  // 1) Charger les users
  const { data: users } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  usersData = users || [];

  // 2) Charger les catégories (pour traduire les UUIDs d'interest_categories)
  const { data: cats } = await sb.from('categories').select('id, nom_fr, icone, couleur');
  categoriesData = cats || [];

  // 3) Charger les counts user_actions (1 requête groupée)
  const counts = {};
  const { data: ua } = await sb.from('user_actions').select('user_id');
  if (ua) ua.forEach(row => { counts[row.user_id] = (counts[row.user_id] || 0) + 1; });

  // Stocker les counts pour la modal
  window.__userActionCounts = counts;

  // 4) Stats d'engagement (vue user_engagement_stats — lecture admin, RLS validées)
  const engMap = {};
  try {
    const { data: eng } = await sb.from('user_engagement_stats').select('*');
    (eng || []).forEach(e => { engMap[e.user_id] = e; });
  } catch (_) { /* fallback : map vide → colonnes 0 / — sans planter la page */ }
  window.__userEngagement = engMap;

  renderUsersTable();
}

function renderUsersTable() {
  const counts = window.__userActionCounts || {};
  const eng = window.__userEngagement || {};

  // Application des filtres + recherche
  let filtered = usersData;

  if (userFilter === 'onboarded') filtered = filtered.filter(u => u.onboarding_completed);
  else if (userFilter === 'pending') filtered = filtered.filter(u => !u.onboarding_completed);
  else if (userFilter === 'premium') filtered = filtered.filter(u => u.is_premium);
  else if (userFilter === 'free') filtered = filtered.filter(u => !u.is_premium);

  if (userSearch.trim()) {
    const q = userSearch.toLowerCase().trim();
    filtered = filtered.filter(u =>
      (u.name || '').toLowerCase().includes(q) ||
      (u.email || '').toLowerCase().includes(q) ||
      (u.city || '').toLowerCase().includes(q)
    );
  }

  // Tri par engagement (après filtres + recherche) — défaut : actions complétées décroissant
  const sortVal = (u) => {
    const e = eng[u.id] || {};
    if (userSortKey === 'last_activity') return e.last_activity ? new Date(e.last_activity).getTime() : 0;
    return Number(e[userSortKey] || 0);
  };
  filtered = [...filtered].sort((a, b) => userSortDir === 'desc' ? sortVal(b) - sortVal(a) : sortVal(a) - sortVal(b));

  // Stats par filtre
  const total = usersData.length;
  const nbOnboarded = usersData.filter(u => u.onboarding_completed).length;
  const nbPending = total - nbOnboarded;
  const nbPremium = usersData.filter(u => u.is_premium).length;
  const nbFree = total - nbPremium;

  const sortArrow = (key) => userSortKey === key ? (userSortDir === 'desc' ? ' ▼' : ' ▲') : '';
  const sortTh = (key, label) => `<th class="th" onclick="setUserSort('${key}')" style="cursor:pointer;user-select:none;text-align:center;" title="Trier">${label}${sortArrow(key)}</th>`;
  const filterBtn = (key, label, count, color) => `
    <button onclick="setUserFilter('${key}')" class="btn btn-sm" style="
      border:1px solid ${userFilter === key ? color : 'rgba(160,160,160,0.2)'};
      color:${userFilter === key ? color : 'var(--text2)'};
      background:${userFilter === key ? color + '15' : 'transparent'};
      font-weight:${userFilter === key ? '600' : '500'};
    ">${label} <span style="opacity:0.7;margin-left:4px;">${count}</span></button>
  `;

  set(`<div style="padding:32px;">

    <!-- HEADER -->
    <div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:22px;font-weight:800;color:var(--text);">Utilisateurs</h1>
        <p style="font-size:13px;color:var(--text2);margin-top:4px;">${filtered.length} affiché${filtered.length > 1 ? 's' : ''} sur ${total} inscrits</p>
      </div>
      <div style="font-size:11px;color:var(--text3);background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.2);padding:6px 12px;border-radius:6px;">
        🛠️ Mode dev : actions de test disponibles
      </div>
    </div>

    <!-- BARRE DE RECHERCHE + FILTRES -->
    <div class="card" style="padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <input
          id="userSearchInput"
          type="text"
          placeholder="🔍 Rechercher un utilisateur (nom, email, ville)..."
          value="${h(userSearch)}"
          oninput="onUserSearchInput(this.value)"
          class="inp"
          style="flex:1;padding:9px 12px;font-size:13px;"
        />
        ${userSearch ? `<button onclick="onUserSearchInput('')" class="btn btn-sm" style="border:1px solid rgba(160,160,160,0.2);color:var(--text2);">✕ Effacer</button>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${filterBtn('all', 'Tous', total, 'var(--gold)')}
        ${filterBtn('onboarded', '✓ Onboarding fini', nbOnboarded, 'rgb(34,197,94)')}
        ${filterBtn('pending', '⏳ En cours', nbPending, 'rgb(251,146,60)')}
        ${filterBtn('premium', '✨ Premium', nbPremium, 'var(--gold)')}
        ${filterBtn('free', 'Gratuit', nbFree, 'rgb(160,160,160)')}
      </div>
    </div>

    <!-- TABLE -->
    <div class="card" style="overflow:auto;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr>
            <th class="th">Utilisateur</th>
            <th class="th">Onboarding</th>
            <th class="th">Niveau</th>
            <th class="th" style="text-align:center;">Actions adoptées</th>
            ${sortTh('actions_completed','Actions complétées')}
            ${sortTh('defis_completed','Défis complétés')}
            ${sortTh('active_days','Jours actifs')}

function onDelConfirmInput() {
  const input = gi('delConfirmInput');
  const btn = gi('delConfirmBtn');
  if (!input || !btn) return;
  const ok = input.value === 'SUPPRIMER';
  btn.disabled = !ok;
  btn.style.cursor = ok ? 'pointer' : 'not-allowed';
  btn.style.opacity = ok ? '1' : '0.5';
}

async function doDeleteAccount(uid) {
  const btn = gi('delConfirmBtn');
  const input = gi('delConfirmInput');
  if (!input || input.value !== 'SUPPRIMER') return;
  if (btn) {
    btn.disabled = true;
    btn.style.cursor = 'not-allowed';
    btn.style.opacity = '0.6';
    btn.textContent = 'Suppression…';
  }

  const { data, error } = await sb.functions.invoke('delete-user-data', { body: { target_user_id: uid } });

  if (error) {
    let msg = error.message || 'Échec de la suppression';
    // Tenter d'extraire le message JSON renvoyé par l'edge function
    try { if (error.context && typeof error.context.json === 'function') { const j = await error.context.json(); if (j?.error) msg = j.error; } } catch {}
    toast(msg, 'err');
    if (btn) {
      btn.disabled = false;
      btn.style.cursor = 'pointer';
      btn.style.opacity = '1';
      btn.textContent = 'Supprimer définitivement';
    }
    return;
  }

  toast('Compte supprimé définitivement');
  closeOverlay();
  renderUsers();
}

// ─── Actions ───
async function togglePremium(uid, cur) {
  // is_premium est DÉRIVÉ (modèle sub_status/current_period_end) : on ne l'écrit
  // plus en direct. Premium actuel → revoke ; Gratuit → grant perpétuel (infinity).
  const call = (force) => cur
    ? sb.rpc('revoke_premium', { p_user_id: uid, p_force: force })
    : sb.rpc('grant_premium', { p_user_id: uid, p_until: 'infinity', p_reason: 'admin panel', p_force: force });
  let { error } = await call(false);
  if (error) {
    // Abonnement RevenueCat actif (source=webhook) : forçage sur confirmation.
    if (/source=webhook/i.test(error.message)) {
      if (!confirm(error.message + '\n\nForcer quand même ?')) return;
      ({ error } = await call(true));
    }
    if (error) { toast(error.message, 'err'); return; }
  }
  toast(!cur ? 'Premium activé !' : 'Premium retiré');
  renderUsers();
}

async function resetOnboarding(uid, name) {
  if (!confirm(`Réinitialiser l'onboarding de ${name} ?\n\nIl devra refaire les 4 étapes à sa prochaine connexion.`)) return;
  const { error } = await sb.from('profiles').update({
    onboarding_completed: false,
    onboarding_step: 1,
    onboarding_completed_at: null,
    interest_categories: []
  }).eq('id', uid);
  if (error) { toast(error.message, 'err'); return; }
  toast(`Onboarding de ${name} réinitialisé`);
  renderUsers();
}

async function clearUserActions(uid, name, nb) {
  if (!confirm(`Supprimer les ${nb} actions de ${name} ?\n\nUtile pour tester l'empty state du dashboard.`)) return;
  const { error } = await sb.from('user_actions').delete().eq('user_id', uid);
  if (error) { toast(error.message, 'err'); return; }
  toast(`${nb} actions supprimées`);
  renderUsers();
}

async function toggleBilanIA(currentlyEnabled) {
  const label = currentlyEnabled ? 'désactiver' : 'réactiver';
  if (!confirm(`Êtes-vous sûr de vouloir ${label} la génération IA ?\n\nCette action est immédiate et affecte tous les utilisateurs.`)) return;
  const newVal = currentlyEnabled ? 'false' : 'true';
  const { error, count } = await sb.from('app_settings').update({ value: newVal, updated_at: new Date().toISOString() }).eq('key','bilan_ia_enabled').select('*', { count: 'exact', head: true });
  if (error) { toast(error.message, 'err'); return; }
  if ((count ?? 0) === 0) { toast('Erreur : clé bilan_ia_enabled introuvable en base', 'err'); return; }
  toast(currentlyEnabled ? 'Génération IA désactivée' : 'Génération IA réactivée');
  renderBilanIA();
}

  return `<span class="badge ${cls}">${h(notifLabel(NOTIF_STATUS_LABELS, s))}</span>`;
}

// ── Envoyer une notif test au compte admin courant (Edge Function send-test-notif).
// Le push part vers les tokens push actifs de l'appelant (admin connecté).
async function sendTestNotif() {
  const btn = gi('sendTestNotifBtn');
  const origLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; btn.textContent = 'Envoi…'; }

  try {
    const { data, error } = await sb.functions.invoke('send-test-notif');

    if (error) {
      let msg = error.message || "Échec de l'envoi";
      let code = null;
      // Extraire le message/errorCode JSON renvoyé par l'edge function
      try { if (error.context && typeof error.context.json === 'function') { const j = await error.context.json(); if (j?.error) msg = j.error; if (j?.errorCode) code = j.errorCode; } } catch {}
      if (code === 'NO_TOKEN') {
        toast("Aucun token push actif : ouvre l'app mobile et accepte les notifications au moins une fois.", 'err');
      } else {
        toast(msg, 'err');
      }
      return;
    }

    const n = data && typeof data.sent === 'number' ? data.sent : '?';
    toast(`✓ Notif test envoyée (${n} token${n > 1 ? 's' : ''})`);
  } finally {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; btn.textContent = origLabel; }
  }
}

let _tplCache = [];

async function loadTplCache() {
  const { data, error } = await sb
    .from('notif_templates')
    .select('*')
    .order('status')
    .order('lang');
  if (error) {
    const msg = (error.message || '') + ' ' + (error.code || '');
    if (/relation .* does not exist|does not exist|notif_templates|PGRST205|404|42P01/i.test(msg)) {
      _tplError = 'missing';
    } else {
      _tplError = error.message || 'Erreur inconnue';
    }
    _tplCache = [];
    return;
  }
  _tplError = null;
  _tplCache = data || [];
}

    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;border-top:1px solid var(--border);padding-top:28px;">
      <div>
        <h2 style="font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.3px;">📝 Templates du coach</h2>
        <p style="font-size:13px;color:var(--text2);margin-top:4px;">Messages des notifications, éditables — table notif_templates. Le dispatch pioche aléatoirement parmi les templates actifs ; à défaut, il retombe sur les messages codés en dur.</p>
      </div>
      <button onclick="openTplModal()" class="btn btn-gold btn-sm">+ Ajouter un template</button>
    </div>`;

  if (_tplError === 'missing') {
    host.innerHTML = headerHtml + `
      <div class="card" style="padding:24px;color:var(--text2);font-size:13px;line-height:1.6;">
        <div style="font-weight:600;color:var(--text);margin-bottom:6px;">Table notif_templates absente.</div>
        Applique les migrations dans le SQL Editor Supabase, dans cet ordre :
        <code style="font-family:'JetBrains Mono',monospace;">20260612000003_notif_templates.sql</code> (DDL) puis
        <code style="font-family:'JetBrains Mono',monospace;">20260612000004_notif_templates_seed.sql</code> (seed, une seule fois).
      </div>`;
    return;
  }
  if (_tplError) {
    host.innerHTML = headerHtml + `<div class="card" style="padding:20px;color:var(--text2);font-size:13px;">Erreur de chargement : ${h(_tplError)}</div>`;
    return;
  }

  let groupsHtml = '';
  for (const s of TPL_STATUSES) {
    for (const l of TPL_LANGS) {
      const items = _tplCache.filter(t => t.status === s && t.lang === l);
      const rows = items.map(t => {
        const badge = t.actif
          ? '<span class="badge b-green">actif</span>'
          : '<span class="badge b-gray">inactif</span>';
        return `<div class="action-item" style="display:flex;align-items:flex-start;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;color:var(--text);line-height:1.5;${t.lang==='he'?'direction:rtl;text-align:right;':''}">${h(t.body)}</div>
            <div style="margin-top:6px;">${badge}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;">
            <button onclick="toggleTpl('${esc(t.id)}', ${t.actif ? 'false' : 'true'})" class="btn btn-ghost btn-sm" title="${t.actif ? 'Désactiver' : 'Activer'}">${t.actif ? '⏸' : '▶'}</button>
            <button onclick="openTplModal('${esc(t.id)}')" class="btn btn-blue btn-sm" title="Modifier">✏️</button>
            <button onclick="delTpl('${esc(t.id)}')" class="btn btn-red btn-sm" title="Supprimer">🗑️</button>
          </div>
        </div>`;
      }).join('');
      groupsHtml += `<details class="tpl-group">
        <summary>
          <span class="tpl-caret">▸</span>
          <span>${h(TPL_STATUS_LABEL[s])}</span><span style="opacity:.5;">·</span><span>${TPL_LANG_LABEL[l]}</span>
          <span style="margin-left:auto;font-weight:500;opacity:.7;">${items.length}</span>
        </summary>
        <div class="tpl-group__body">
          ${items.length ? `<div style="display:flex;flex-direction:column;gap:8px;">${rows}</div>`
            : `<div style="font-size:12px;color:var(--text2);padding:8px 0;opacity:.7;">Aucun template — le dispatch utilisera le filet de secours codé en dur.</div>`}
        </div>
      </details>`;
    }
  }

  host.innerHTML = headerHtml + `<div class="card" style="padding:18px 20px;">${groupsHtml}</div>`;
}

async function openTplModal(id) {
  let it = { status: 'lapsed', lang: 'fr', body: '', actif: true };
  if (id) {
    const found = _tplCache.find(t => String(t.id) === String(id));
    if (found) it = found;
  }
  const statusOpts = TPL_STATUSES.map(s => `<option value="${s}" ${it.status===s?'selected':''}>${h(TPL_STATUS_LABEL[s])}</option>`).join('');
  const langOpts = TPL_LANGS.map(l => `<option value="${l}" ${it.lang===l?'selected':''}>${h(TPL_LANG_LABEL[l])}</option>`).join('');
  openModal(`<div style="padding:24px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <h2 style="font-size:17px;font-weight:800;color:var(--text);">${id ? 'Modifier le template' : 'Nouveau template'}</h2>
      <button onclick="closeModal()" class="btn btn-ghost btn-icon">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="fl">Statut</label><select id="t_status" class="inp">${statusOpts}</select></div>
        <div><label class="fl">Langue</label><select id="t_lang" class="inp">${langOpts}</select></div>
      </div>
      <div><label class="fl">Message *</label><textarea id="t_body" class="inp" rows="4" style="resize:vertical;" placeholder="Texte du message de notification…">${h(it.body)}</textarea></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <label class="toggle"><input type="checkbox" id="t_actif" ${it.actif?'checked':''}><span class="tslider"></span></label>
        <span style="font-size:13px;color:var(--text2);">Template actif</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
      <button onclick="saveTpl('${esc(id||'')}')" class="btn btn-gold" style="flex:1;justify-content:center;padding:11px;">💾 Enregistrer</button>
      <button onclick="closeModal()" class="btn btn-ghost">Annuler</button>
    </div>
  </div>`);
}

async function saveTpl(id) {
  const body = v('t_body');
  if (!body) { toast('Le message est obligatoire', 'err'); return; }
  const d = { status: v('t_status'), lang: v('t_lang'), body, actif: cb('t_actif') };
  const { error } = id
    ? await sb.from('notif_templates').update(d).eq('id', id)
    : await sb.from('notif_templates').insert(d);
  if (error) { toast(error.message, 'err'); return; }
  toast(id ? 'Template mis à jour !' : 'Template créé !');
  closeModal();
  await renderTemplates();
}

async function toggleTpl(id, actif) {
  const { error } = await sb.from('notif_templates').update({ actif }).eq('id', id);
  if (error) { toast(error.message, 'err'); return; }
  toast(actif ? 'Template activé' : 'Template désactivé');
  await renderTemplates();
}

async function delTpl(id) {
  if (!confirm('Supprimer ce template ?')) return;
  const { data, error } = await sb.from('notif_templates').delete().eq('id', id).select('id');
  if (error) { toast(error.message, 'err'); return; }
  if (!data || data.length === 0) { toast(RLS_HINT, 'err'); return; }
  toast('Template supprimé');
  await renderTemplates();
}
</script>
</body>
</html>
