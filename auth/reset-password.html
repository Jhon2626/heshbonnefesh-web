<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>HeshbonNefesh — Nouveau mot de passe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1A2744;
      background: linear-gradient(180deg, #10162E 0%, #1A2744 60%, #2A2F6E 100%);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #F7F3E8;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .emblem {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(201,168,76,0.14);
      border: 1.5px solid rgba(201,168,76,0.5);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 32px;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 15px; line-height: 1.55; color: rgba(247,243,232,0.8); margin-bottom: 8px; }
    .btn {
      display: inline-block; margin-top: 22px;
      background: #C9A84C; color: #1A2744;
      font-size: 16px; font-weight: 700; text-decoration: none;
      padding: 15px 36px; border-radius: 14px;
    }
    .hint { font-size: 12px; color: rgba(247,243,232,0.55); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emblem">🔑</div>
    <h1 id="title">Réinitialisation du mot de passe</h1>
    <p id="msg">Ouvre l'application pour choisir<br/>ton nouveau mot de passe.</p>
    <a class="btn" id="openBtn" href="#">Ouvrir HeshbonNefesh</a>
    <p class="hint">Si l'application ne s'ouvre pas, lance-la manuellement puis réessaie depuis l'e-mail.</p>
  </div>
  <script>
    (function () {
      // Relaie query + fragment tels quels vers l'app (token_hash / jetons / erreurs).
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var deepLink = 'heshbonnefesh://auth/reset-password' + search + hash;
      document.getElementById('openBtn').setAttribute('href', deepLink);

      var all = (search ? search.slice(1) : '') + (hash ? '&' + hash.slice(1) : '');

      if (all.indexOf('error') !== -1) {
        document.getElementById('title').textContent = 'Lien expiré ou déjà utilisé';
        document.getElementById('msg').innerHTML = "Redemande un e-mail de réinitialisation depuis l'application.";
      }

      if (all.indexOf('token_hash=') !== -1 || all.indexOf('access_token=') !== -1 || all.indexOf('code=') !== -1) {
        setTimeout(function () { window.location.href = deepLink; }, 350);
      }
    })();
  </script>
</body>
</html>
